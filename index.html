
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="gallery">
        <div class="gallery-item">
            <img src="https://picsum.photos/id/1015/400/250" alt="Ảnh phong cảnh núi">
            <div class="description">Mountain</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1018/400/250" alt="Ảnh phong cảnh thiên nhiên">
            <div class="description">Nature</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1019/400/250" alt="Ảnh phong cảnh">
            <div class="description">Landscape</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1020/400/250" alt="Ảnh rừng cây">
            <div class="description">Forest</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1024/400/250" alt="Ảnh động vật">
            <div class="description">Animal</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1035/400/250" alt="Ảnh dòng sông">
            <div class="description">River</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1039/400/250" alt="Ảnh thiên nhiên">
            <div class="description">Scenery</div>
        </div>

        <div class="gallery-item">
            <img src="https://picsum.photos/id/1043/400/250" alt="Ảnh biển">
            <div class="description">Sea</div>
        </div>
    </div>

</body>
</html>
